<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="./src/style.css">
    <title>login</title>
</head>

<body>
    <div class="app">
        <div class="header">
            <h1 id="title">login v0.0</h1>
        </div>
        <div class="main">
            <input id="email" type="email" class="hidden" placeholder="Email" />
            <input id="username" type="text" placeholder="Username" />
            <input id="password" type="password" placeholder="Password" />
            <input id="submit" class="button-primary" type="submit" value="LOGIN" />
            <p id="register" class="link">Register?</p>
        </div>
        <div class="footer">
            <button id="whoami" class="button-secondary">whoami?</button>
            <button id="logout" class="button-secondary btn-logout">logout</button>
        </div>
    </div>

    <script type="module" src="./src/main.js"></script>
</body>

</html>
